---
- name: Roll back relay observability gateway
  hosts: "{{ target_hosts | default('relay') }}"
  become: true
  gather_facts: false
  serial: 1
  tasks:
    - name: Remove gateway nginx config
      ansible.builtin.file:
        path: "{{ ops_metrics_gateway_conf_path | default('/etc/nginx/conf.d/ouro-ops-metrics.conf') }}"
        state: absent

    - name: Remove metrics gateway htpasswd file
      ansible.builtin.file:
        path: "{{ ops_metrics_htpasswd_path | default('/etc/ouro-ops/.htpasswd') }}"
        state: absent

    - name: Remove local Prometheus container for observability gateway
      community.docker.docker_container:
        name: "{{ ops_metrics_prometheus_container_name | default('ouro-ops-prometheus') }}"
        state: absent
      failed_when: false

    - name: Remove local Prometheus config for observability gateway
      ansible.builtin.file:
        path: "{{ ops_metrics_prometheus_config_path | default('/etc/ouro-ops/prometheus.yml') }}"
        state: absent

    - name: Validate nginx configuration after rollback
      ansible.builtin.command: nginx -t
      changed_when: false
      failed_when: false
      register: observability_rollback_nginx_test

    - name: Reload nginx after rollback
      ansible.builtin.service:
        name: nginx
        state: reloaded
      when: observability_rollback_nginx_test.rc == 0
