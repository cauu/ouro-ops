---
- name: Safe validation mode (read-only checks)
  hosts: all
  become: true
  tasks:
    - name: Run safe-validate role
      ansible.builtin.include_role:
        name: safe-validate
      when: safe_validation_mode | default(false) | bool

- name: Deploy common and hardening baseline
  hosts: all
  become: true
  tasks:
    - name: Run common role
      ansible.builtin.include_role:
        name: common
      when: not (safe_validation_mode | default(false) | bool)

    - name: Run hardening role
      ansible.builtin.include_role:
        name: hardening
      when: (not (safe_validation_mode | default(false) | bool)) and (enable_hardening | default(true) | bool)

- name: Takeover and deploy cardano runtime
  hosts: relay:bp
  become: true
  tasks:
    - name: Run takeover role
      ansible.builtin.include_role:
        name: takeover
      when: (not (safe_validation_mode | default(false) | bool)) and (takeover_existing_node | default(false) | bool)

    - name: Run cardano-node role
      ansible.builtin.include_role:
        name: cardano-node
      when: not (safe_validation_mode | default(false) | bool)

- name: Configure relay observability gateway
  hosts: relay
  become: true
  gather_facts: false
  serial: 1
  tasks:
    - name: Generate shared metrics basic auth password when missing
      ansible.builtin.set_fact:
        generated_metrics_basic_auth_password: "{{ lookup('password', '/dev/null chars=ascii_letters,digits length=40') }}"
      run_once: true
      no_log: true
      when:
        - not (safe_validation_mode | default(false) | bool)
        - enable_ops_observability_gateway | default(true) | bool
        - (ops_metrics_basic_auth_password | default('') | trim | length) == 0

    - name: Propagate generated metrics password to relay hosts
      ansible.builtin.set_fact:
        ops_metrics_basic_auth_password: "{{ hostvars[ansible_play_hosts_all[0]].generated_metrics_basic_auth_password }}"
      no_log: true
      when:
        - not (safe_validation_mode | default(false) | bool)
        - enable_ops_observability_gateway | default(true) | bool
        - (ops_metrics_basic_auth_password | default('') | trim | length) == 0

    - name: Run ops-observability-gateway role
      ansible.builtin.include_role:
        name: ops-observability-gateway
      when:
        - not (safe_validation_mode | default(false) | bool)
        - enable_ops_observability_gateway | default(true) | bool
