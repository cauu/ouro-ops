---
- name: Safe validation mode (read-only checks)
  hosts: all
  become: true
  tasks:
    - name: Run safe-validate role
      ansible.builtin.include_role:
        name: safe-validate
      when: safe_validation_mode | default(false) | bool

- name: Deploy common and hardening baseline
  hosts: all
  become: true
  tasks:
    - name: Run common role
      ansible.builtin.include_role:
        name: common
      when: not (safe_validation_mode | default(false) | bool)

    - name: Run hardening role
      ansible.builtin.include_role:
        name: hardening
      when: (not (safe_validation_mode | default(false) | bool)) and (enable_hardening | default(true) | bool)

- name: Takeover and deploy cardano runtime
  hosts: relay:bp
  become: true
  tasks:
    - name: Run takeover role
      ansible.builtin.include_role:
        name: takeover
      when: (not (safe_validation_mode | default(false) | bool)) and (takeover_existing_node | default(false) | bool)

    - name: Run cardano-node role
      ansible.builtin.include_role:
        name: cardano-node
      when: not (safe_validation_mode | default(false) | bool)
