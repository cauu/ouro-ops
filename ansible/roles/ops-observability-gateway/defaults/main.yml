---
ops_metrics_gateway_server_name: "_"
ops_metrics_gateway_listen_port: 443
ops_metrics_prometheus_upstream: "http://127.0.0.1:9090"
ops_metrics_gateway_conf_path: "/etc/nginx/conf.d/ouro-ops-metrics.conf"
ops_metrics_prometheus_container_name: "ouro-ops-prometheus"
ops_metrics_prometheus_image: "prom/prometheus:v2.55.1"
ops_metrics_prometheus_config_path: "/etc/ouro-ops/prometheus.yml"
ops_metrics_prometheus_host_bind: "127.0.0.1:9090:9090"
ops_metrics_prometheus_scrape_interval: "15s"
ops_metrics_prometheus_scrape_timeout: "5s"
ops_metrics_scrape_targets: []

ops_metrics_basic_auth_realm: "ouro-ops-metrics"
ops_metrics_basic_auth_username: "ouro_app"
ops_metrics_basic_auth_password: ""
ops_metrics_htpasswd_path: "/etc/ouro-ops/.htpasswd"
ops_metrics_nginx_user: ""
ops_metrics_nginx_group: ""

ops_metrics_tls_cert_path: "/etc/ssl/certs/ouro-ops.crt"
ops_metrics_tls_key_path: "/etc/ssl/private/ouro-ops.key"
ops_metrics_require_tls_materials: true
ops_metrics_tls_auto_generate_self_signed: true
ops_metrics_tls_self_signed_valid_days: 365
ops_metrics_tls_self_signed_key_bits: 2048
