---
- name: Ensure nginx and htpasswd tools are installed
  apt:
    name:
      - nginx
      - apache2-utils
      - openssl
    state: present
    update_cache: true

- name: Allow telemetry gateway port in UFW when available
  shell: |
    if command -v ufw >/dev/null 2>&1; then
      ufw allow {{ ops_metrics_gateway_listen_port }}/tcp
    fi
  args:
    executable: /bin/bash
  changed_when: false
  failed_when: false

- name: Fail when Basic Auth password is missing
  fail:
    msg: "ops_metrics_basic_auth_password is required"
  when: (ops_metrics_basic_auth_password | default('') | trim | length) == 0

- name: Detect nginx runtime user from nginx.conf
  shell: |
    set -euo pipefail
    awk '/^\s*user\s+/{gsub(/;/, "", $2); print $2; exit}' /etc/nginx/nginx.conf
  args:
    executable: /bin/bash
  register: ops_metrics_nginx_user_detect
  changed_when: false
  failed_when: false

- name: Resolve effective nginx user for auth file permissions
  set_fact:
    ops_metrics_effective_nginx_user: >-
      {{
        (
          ops_metrics_nginx_user
          if (ops_metrics_nginx_user | default('') | trim | length) > 0
          else (ops_metrics_nginx_user_detect.stdout | default('') | trim)
        )
        | default('www-data', true)
      }}

- name: Resolve effective nginx group for auth file permissions
  set_fact:
    ops_metrics_effective_nginx_group: >-
      {{
        (
          ops_metrics_nginx_group
          if (ops_metrics_nginx_group | default('') | trim | length) > 0
          else ops_metrics_effective_nginx_user
        )
        | default('www-data', true)
      }}

- name: Ensure ouro-ops auth directory exists
  file:
    path: /etc/ouro-ops
    state: directory
    owner: root
    group: "{{ ops_metrics_effective_nginx_group }}"
    mode: "0750"

- name: Build effective scrape targets from supplied topology
  set_fact:
    ops_metrics_effective_scrape_targets: "{{ ops_metrics_scrape_targets | default([]) }}"

- name: Detect cardano-node container IP for fallback local scrape target
  shell: "docker inspect --format '{{\"{{\"}}range .NetworkSettings.Networks{{\"}}\"}}{{\"{{\"}}.IPAddress{{\"}}\"}}{{\"{{\"}}end{{\"}}\"}}' cardano-node"
  register: ops_metrics_cardano_container_ip
  changed_when: false
  failed_when: false
  when: (ops_metrics_effective_scrape_targets | length) == 0

- name: Fail when no scrape target can be resolved
  fail:
    msg: "No telemetry scrape target is available; provide ops_metrics_scrape_targets or ensure local cardano-node is running"
  when:
    - (ops_metrics_effective_scrape_targets | length) == 0
    - (ops_metrics_cardano_container_ip.stdout | default('') | trim | length) == 0

- name: Build fallback scrape target from local cardano-node container
  set_fact:
    ops_metrics_effective_scrape_targets:
      - target: "{{ (ops_metrics_cardano_container_ip.stdout | trim) ~ ':12798' }}"
        node: "{{ inventory_hostname }}"
        role: relay
        host_ip: "{{ ansible_host | default(inventory_hostname) }}"
  when:
    - (ops_metrics_effective_scrape_targets | length) == 0
    - (ops_metrics_cardano_container_ip.stdout | default('') | trim | length) > 0

- name: Render local Prometheus config for telemetry gateway
  template:
    src: prometheus.yml.j2
    dest: "{{ ops_metrics_prometheus_config_path }}"
    owner: root
    group: root
    mode: "0644"

- name: Ensure local Prometheus container is running for whitelist API upstream
  community.docker.docker_container:
    name: "{{ ops_metrics_prometheus_container_name }}"
    image: "{{ ops_metrics_prometheus_image }}"
    state: started
    recreate: true
    restart_policy: unless-stopped
    command: "--config.file=/etc/prometheus/prometheus.yml --web.listen-address=0.0.0.0:9090 --storage.tsdb.path=/prometheus"
    ports:
      - "{{ ops_metrics_prometheus_host_bind }}"
    volumes:
      - "{{ ops_metrics_prometheus_config_path }}:/etc/prometheus/prometheus.yml:ro"

- name: Wait for local Prometheus query API ready
  shell: |
    set -euo pipefail
    wget -qO- http://127.0.0.1:9090/-/ready >/dev/null 2>&1 || curl -fsS http://127.0.0.1:9090/-/ready >/dev/null 2>&1
  args:
    executable: /bin/bash
  register: ops_metrics_prometheus_ready
  retries: 20
  delay: 2
  until: ops_metrics_prometheus_ready.rc == 0
  changed_when: false

- name: Check TLS certificate file
  stat:
    path: "{{ ops_metrics_tls_cert_path }}"
  register: ops_metrics_tls_cert_stat
  when: ops_metrics_require_tls_materials | bool

- name: Check TLS private key file
  stat:
    path: "{{ ops_metrics_tls_key_path }}"
  register: ops_metrics_tls_key_stat
  when: ops_metrics_require_tls_materials | bool

- name: Auto-generate self-signed TLS materials when missing
  block:
    - name: Ensure TLS certificate directory exists
      file:
        path: "{{ ops_metrics_tls_cert_path | dirname }}"
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: Ensure TLS private key directory exists
      file:
        path: "{{ ops_metrics_tls_key_path | dirname }}"
        state: directory
        owner: root
        group: root
        mode: "0700"

    - name: Generate self-signed certificate for metrics gateway
      command:
        argv:
          - openssl
          - req
          - -x509
          - -newkey
          - "rsa:{{ ops_metrics_tls_self_signed_key_bits }}"
          - -sha256
          - -days
          - "{{ ops_metrics_tls_self_signed_valid_days }}"
          - -nodes
          - -subj
          - "/CN={{ ansible_host | default(inventory_hostname) }}"
          - -keyout
          - "{{ ops_metrics_tls_key_path }}"
          - -out
          - "{{ ops_metrics_tls_cert_path }}"
      no_log: true

    - name: Restrict TLS private key permissions
      file:
        path: "{{ ops_metrics_tls_key_path }}"
        owner: root
        group: root
        mode: "0600"
  when:
    - ops_metrics_require_tls_materials | bool
    - ops_metrics_tls_auto_generate_self_signed | bool
    - not (ops_metrics_tls_cert_stat.stat.exists | default(false)) or not (ops_metrics_tls_key_stat.stat.exists | default(false))

- name: Re-check TLS certificate file
  stat:
    path: "{{ ops_metrics_tls_cert_path }}"
  register: ops_metrics_tls_cert_stat
  when: ops_metrics_require_tls_materials | bool

- name: Re-check TLS private key file
  stat:
    path: "{{ ops_metrics_tls_key_path }}"
  register: ops_metrics_tls_key_stat
  when: ops_metrics_require_tls_materials | bool

- name: Fail when TLS certificate is missing
  fail:
    msg: "TLS certificate not found: {{ ops_metrics_tls_cert_path }}"
  when:
    - ops_metrics_require_tls_materials | bool
    - not (ops_metrics_tls_cert_stat.stat.exists | default(false))

- name: Fail when TLS private key is missing
  fail:
    msg: "TLS private key not found: {{ ops_metrics_tls_key_path }}"
  when:
    - ops_metrics_require_tls_materials | bool
    - not (ops_metrics_tls_key_stat.stat.exists | default(false))

- name: Render htpasswd file for metrics gateway
  shell: "htpasswd -bc {{ ops_metrics_htpasswd_path }} {{ ops_metrics_basic_auth_username }} {{ ops_metrics_basic_auth_password }}"
  args:
    executable: /bin/bash
  no_log: true

- name: Restrict htpasswd file permissions
  file:
    path: "{{ ops_metrics_htpasswd_path }}"
    owner: root
    group: "{{ ops_metrics_effective_nginx_group }}"
    mode: "0640"

- name: Render metrics gateway nginx config
  template:
    src: ouro-ops-metrics.conf.j2
    dest: "{{ ops_metrics_gateway_conf_path }}"
    owner: root
    group: root
    mode: "0644"
  notify: Reload nginx

- name: Validate nginx configuration
  command: nginx -t
  changed_when: false

- name: Ensure nginx is enabled and running
  service:
    name: nginx
    state: started
    enabled: true
