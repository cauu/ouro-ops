---
- name: Preflight disk check (>=50GB)
  shell: "df -BG / | awk 'NR==2 {gsub(/G/, \"\", $4); print $4}'"
  register: disk_available
  changed_when: false

- name: Fail when disk is insufficient
  fail:
    msg: "disk insufficient: {{ disk_available.stdout }}GB"
  when: (disk_available.stdout | int) < 50

- name: Ensure Cardano directories exist
  file:
    path: "{{ item }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  loop:
    - /opt/cardano/config
    - /opt/cardano/keys
    - /opt/cardano/logs
    - /opt/cardano/db
    - /opt/cardano/ipc

- name: Ensure runtime directories are writable by container user
  file:
    path: "{{ item.path }}"
    state: directory
    owner: "{{ item.owner }}"
    group: "{{ item.group }}"
    mode: "{{ item.mode }}"
  loop:
    - { path: "/opt/cardano/db", owner: "1000", group: "1000", mode: "0770" }
    - { path: "/opt/cardano/ipc", owner: "1000", group: "1000", mode: "0770" }
    - { path: "/opt/cardano/keys", owner: "1000", group: "1000", mode: "0770" }
    - { path: "/opt/cardano/logs", owner: "1000", group: "1000", mode: "0770" }

- name: Ensure network config directory exists
  file:
    path: "/opt/cardano/config/{{ network }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Check legacy data directory
  stat:
    path: /opt/cardano/data
  register: legacy_data_dir

- name: Probe whether new db directory already has data
  shell: "find /opt/cardano/db -mindepth 1 -maxdepth 1 -print -quit"
  register: new_db_probe
  changed_when: false
  failed_when: false

- name: Migrate legacy data into /opt/cardano/db (one-time)
  shell: |
    set -euo pipefail
    echo "[`date -u +%Y-%m-%dT%H:%M:%SZ`] migrating /opt/cardano/data -> /opt/cardano/db" | tee -a /opt/cardano/logs/deploy-migration.log
    if command -v rsync >/dev/null 2>&1; then
      rsync -a --ignore-existing /opt/cardano/data/ /opt/cardano/db/
    else
      cp -a /opt/cardano/data/. /opt/cardano/db/
    fi
    echo "[`date -u +%Y-%m-%dT%H:%M:%SZ`] migration completed" | tee -a /opt/cardano/logs/deploy-migration.log
  args:
    executable: /bin/bash
  when:
    - legacy_data_dir.stat.exists | default(false)
    - (new_db_probe.stdout | trim | length) == 0

- name: Download network config file for non-mainnet environments
  get_url:
    url: "https://book.world.dev.cardano.org/environments/{{ network }}/config.json"
    dest: "/opt/cardano/config/{{ network }}/config.json"
    mode: "0644"
  register: cardano_network_config_result
  when: network != "mainnet"

- name: Render bundled mainnet config compatible with 10.5.4-1
  template:
    src: config-mainnet-10.5.4-1.json.j2
    dest: "/opt/cardano/config/mainnet/config.json"
    mode: "0644"
  register: cardano_mainnet_config_result
  when: network == "mainnet"

- name: Download network genesis byron file
  get_url:
    url: "https://book.world.dev.cardano.org/environments/{{ network }}/byron-genesis.json"
    dest: "/opt/cardano/config/{{ network }}/byron-genesis.json"
    mode: "0644"
  register: cardano_byron_genesis_result

- name: Download network genesis shelley file
  get_url:
    url: "https://book.world.dev.cardano.org/environments/{{ network }}/shelley-genesis.json"
    dest: "/opt/cardano/config/{{ network }}/shelley-genesis.json"
    mode: "0644"
  register: cardano_shelley_genesis_result

- name: Download network genesis alonzo file
  get_url:
    url: "https://book.world.dev.cardano.org/environments/{{ network }}/alonzo-genesis.json"
    dest: "/opt/cardano/config/{{ network }}/alonzo-genesis.json"
    mode: "0644"
  register: cardano_alonzo_genesis_result

- name: Download network genesis conway file
  get_url:
    url: "https://book.world.dev.cardano.org/environments/{{ network }}/conway-genesis.json"
    dest: "/opt/cardano/config/{{ network }}/conway-genesis.json"
    mode: "0644"
  register: cardano_conway_genesis_result

- name: Define Mithril network configuration
  set_fact:
    cardano_mithril_release_name: "{{ 'release-mainnet' if network == 'mainnet' else 'release-preprod' }}"
    cardano_mithril_aggregator_endpoint: "https://aggregator.{{ 'release-mainnet' if network == 'mainnet' else 'release-preprod' }}.api.mithril.network/aggregator"
  when: network in ['mainnet', 'preprod']

- name: Download Mithril genesis verification key
  get_url:
    url: "https://raw.githubusercontent.com/input-output-hk/mithril/main/mithril-infra/configuration/{{ cardano_mithril_release_name }}/genesis.vkey"
    dest: "/opt/cardano/config/{{ network }}/genesis.vkey"
    mode: "0644"
  register: cardano_mithril_genesis_vkey_result
  when: network in ['mainnet', 'preprod']

- name: Download Mithril ancillary verification key
  get_url:
    url: "https://raw.githubusercontent.com/input-output-hk/mithril/main/mithril-infra/configuration/{{ cardano_mithril_release_name }}/ancillary.vkey"
    dest: "/opt/cardano/config/{{ network }}/ancillary.vkey"
    mode: "0644"
  register: cardano_mithril_ancillary_vkey_result
  when: network in ['mainnet', 'preprod']

- name: Render topology template
  template:
    src: topology-p2p.json.j2
    dest: "/opt/cardano/config/{{ network }}/topology.json"
    mode: "0644"
  register: cardano_topology_result

- name: Determine whether runtime config changed
  set_fact:
    cardano_runtime_config_changed: >-
      {{
        (cardano_network_config_result is defined and (cardano_network_config_result.changed | default(false)))
        or (cardano_mainnet_config_result is defined and (cardano_mainnet_config_result.changed | default(false)))
        or (cardano_byron_genesis_result.changed | default(false))
        or (cardano_shelley_genesis_result.changed | default(false))
        or (cardano_alonzo_genesis_result.changed | default(false))
        or (cardano_conway_genesis_result.changed | default(false))
        or (cardano_mithril_genesis_vkey_result is defined and (cardano_mithril_genesis_vkey_result.changed | default(false)))
        or (cardano_mithril_ancillary_vkey_result is defined and (cardano_mithril_ancillary_vkey_result.changed | default(false)))
        or (cardano_topology_result.changed | default(false))
      }}

- name: Check required BP key files
  stat:
    path: "{{ item }}"
  register: bp_key_stats
  loop:
    - /opt/cardano/keys/kes.skey
    - /opt/cardano/keys/node.cert
    - /opt/cardano/keys/vrf.skey
  when: role == "bp"

- name: Fail when required BP key files are missing
  fail:
    msg: >-
      missing block producer key files under /opt/cardano/keys:
      {{
        bp_key_stats.results
        | rejectattr('stat.exists')
        | map(attribute='stat.path')
        | list
        | join(', ')
      }}
  when:
    - role == "bp"
    - (bp_key_stats.results | rejectattr('stat.exists') | list | length) > 0

- name: Check whether cardano DB already contains protocolMagicId
  stat:
    path: /opt/cardano/db/protocolMagicId
  register: cardano_db_protocol_magic_id

- name: Probe whether cardano DB directory contains residual files
  shell: "find /opt/cardano/db -mindepth 1 -maxdepth 1 -print -quit"
  register: cardano_db_content_probe
  changed_when: false
  failed_when: false

- name: Determine whether Mithril snapshot restore should run
  set_fact:
    cardano_restore_snapshot_effective: >-
      {{
        (restore_snapshot | default(false) | bool)
        and (network in ['mainnet', 'preprod'])
        and not (cardano_db_protocol_magic_id.stat.exists | default(false))
      }}
    cardano_restore_snapshot_reason: >-
      {{
        'cold-start db without protocolMagicId'
        if (
          (restore_snapshot | default(false) | bool)
          and (network in ['mainnet', 'preprod'])
          and not (cardano_db_protocol_magic_id.stat.exists | default(false))
        )
        else
        (
          'db already initialized'
          if (cardano_db_protocol_magic_id.stat.exists | default(false))
          else
          (
            'network does not support Mithril restore'
            if (network not in ['mainnet', 'preprod'])
            else 'restore_snapshot disabled by payload'
          )
        )
      }}

- name: Report Mithril restore decision
  debug:
    msg:
      requested: "{{ restore_snapshot | default(false) | bool }}"
      effective: "{{ cardano_restore_snapshot_effective | default(false) | bool }}"
      reason: "{{ cardano_restore_snapshot_reason }}"
  changed_when: false

- name: Clean residual cold-start DB contents before Mithril restore
  shell: |
    set -euo pipefail
    find /opt/cardano/db -mindepth 1 -maxdepth 1 -exec rm -rf {} +
  args:
    executable: /bin/bash
  when:
    - cardano_restore_snapshot_effective | default(false) | bool
    - not (cardano_db_protocol_magic_id.stat.exists | default(false))
    - (cardano_db_content_probe.stdout | trim | length) > 0

- name: Read Mithril genesis verification key content
  slurp:
    src: "/opt/cardano/config/{{ network }}/genesis.vkey"
  register: cardano_mithril_genesis_vkey_raw
  when: cardano_restore_snapshot_effective | default(false) | bool

- name: Read Mithril ancillary verification key content
  slurp:
    src: "/opt/cardano/config/{{ network }}/ancillary.vkey"
  register: cardano_mithril_ancillary_vkey_raw
  when: cardano_restore_snapshot_effective | default(false) | bool

- name: Resolve cardano image reference (digest preferred)
  set_fact:
    cardano_image_ref: >-
      {{
        (image_registry | default('ghcr.io/blinklabs-io/cardano-node', true) | trim)
        ~
        (
          '@' ~ (image_digest | default('', true) | trim)
          if ((image_digest | default('', true) | trim | length) > 0)
          else ':' ~ (cardano_version | default('10.5.4-1', true) | trim)
        )
      }}

- name: Pull cardano image (tag/digest)
  community.docker.docker_image:
    name: "{{ cardano_image_ref }}"
    source: pull

- name: Resolve takeover switch strategy
  set_fact:
    takeover_switch_enabled: >-
      {{
        (takeover_existing_node | default(false) | bool)
        and (takeover_container_present | default(false) | bool)
        and (takeover_managed_by_compose | default(false) | bool)
      }}
    takeover_legacy_container_name: >-
      cardano-node-legacy-{{ ansible_date_time.epoch }}-{{ inventory_hostname | regex_replace('[^a-zA-Z0-9_.-]', '_') }}

- name: Start cardano node with takeover rollback guard
  block:
    - name: Stop legacy cardano-node before takeover switch
      community.docker.docker_container:
        name: cardano-node
        state: stopped
      when: takeover_switch_enabled

    - name: Rename legacy cardano-node container
      ansible.builtin.shell: "docker rename cardano-node {{ takeover_legacy_container_name }}"
      changed_when: true
      when: takeover_switch_enabled

    - name: Build cardano container environment
      set_fact:
        cardano_env: >-
          {{
            {
              'CARDANO_BLOCK_PRODUCER': 'true' if role == 'bp' else 'false',
              'CARDANO_CONFIG_BASE': '/opt/cardano/config',
              'CARDANO_NETWORK': network,
              'CARDANO_CONFIG': '/opt/cardano/config/' ~ network ~ '/config.json',
              'CARDANO_TOPOLOGY': '/opt/cardano/config/' ~ network ~ '/topology.json',
              'CARDANO_DATABASE_PATH': '/data/db',
              'CARDANO_SOCKET_PATH': '/ipc/node.socket',
              'CARDANO_PORT': '3001',
              'RESTORE_SNAPSHOT': ('true' if (cardano_restore_snapshot_effective | default(false) | bool) else 'false')
            }
            | combine(
              (cardano_restore_snapshot_effective | default(false) | bool)
              | ternary(
                {
                  'AGGREGATOR_ENDPOINT': cardano_mithril_aggregator_endpoint,
                  'GENESIS_VERIFICATION_KEY': (cardano_mithril_genesis_vkey_raw.content | b64decode | trim),
                  'ANCILLARY_VERIFICATION_KEY': (cardano_mithril_ancillary_vkey_raw.content | b64decode | trim)
                },
                {}
              )
            )
            | combine(
              (role == 'bp')
              | ternary(
                {
                  'CARDANO_SHELLEY_KES_KEY': '/opt/cardano/config/keys/kes.skey',
                  'CARDANO_SHELLEY_OPERATIONAL_CERTIFICATE': '/opt/cardano/config/keys/node.cert',
                  'CARDANO_SHELLEY_VRF_KEY': '/opt/cardano/config/keys/vrf.skey'
                },
                {}
              )
            )
          }}

    - name: Start cardano-node container
      community.docker.docker_container:
        name: cardano-node
        image: "{{ cardano_image_ref }}"
        state: started
        restart: "{{ cardano_runtime_config_changed | default(false) }}"
        restart_policy: unless-stopped
        command: run
        env: "{{ cardano_env }}"
        ports:
          - "3001:3001"
        volumes:
          - /opt/cardano/config:/opt/cardano/config
          - /opt/cardano/db:/data/db
          - /opt/cardano/ipc:/ipc
          - /opt/cardano/keys:/opt/cardano/config/keys

    - name: Wait for cardano container to stay running
      shell: docker inspect --format '{{"{{"}}if and .State.Running (not .State.Restarting){{"}}"}}ok{{"{{"}}end{{"}}"}}' cardano-node
      register: cardano_running_check
      until: cardano_running_check.rc == 0 and (cardano_running_check.stdout | trim) == 'ok'
      retries: 24
      delay: 5
      changed_when: false

    - name: Capture Mithril startup logs
      shell: docker logs --tail 50 cardano-node 2>&1
      register: cardano_mithril_startup_logs
      changed_when: false
      failed_when: false
      when: cardano_restore_snapshot_effective | default(false) | bool

    - name: Record Mithril restore startup readiness
      debug:
        msg:
          restore_snapshot: true
          readiness: restore-in-progress
          note: >-
            Container is running and Mithril restore logs were detected. Immediate socket/tip
            readiness is deferred to monitor_snapshot until restore completes.
          mithril_log_excerpt: "{{ (cardano_mithril_startup_logs.stdout_lines | default([]))[-5:] }}"
      changed_when: false
      when: cardano_restore_snapshot_effective | default(false) | bool

    - name: Wait for cardano socket file inside container
      shell: docker exec cardano-node sh -lc 'test -S /ipc/node.socket'
      register: cardano_socket_check
      until: cardano_socket_check.rc == 0
      retries: 24
      delay: 5
      changed_when: false
      when: not (cardano_restore_snapshot_effective | default(false) | bool)

    - name: Wait for initial cardano tip query to succeed
      shell: |
        docker exec cardano-node cardano-cli query tip \
          --socket-path /ipc/node.socket \
          --{{ network }}
      register: cardano_tip_raw
      until: cardano_tip_raw.rc == 0
      retries: 24
      delay: 5
      changed_when: false
      when: not (cardano_restore_snapshot_effective | default(false) | bool)

    - name: Parse initial cardano tip observation
      set_fact:
        cardano_tip_observation: "{{ cardano_tip_raw.stdout | from_json }}"
      when: not (cardano_restore_snapshot_effective | default(false) | bool)

    - name: Record initial cardano tip observation
      debug:
        msg:
          block: "{{ cardano_tip_observation.block | default('unknown') }}"
          syncProgress: "{{ cardano_tip_observation.syncProgress | default('unknown') }}"
          era: "{{ cardano_tip_observation.era | default('unknown') }}"
          hash: "{{ cardano_tip_observation.hash | default('unknown') }}"
      changed_when: false
      when: not (cardano_restore_snapshot_effective | default(false) | bool)

  rescue:
    - name: Capture failed cardano container status
      ansible.builtin.shell: "docker inspect cardano-node"
      register: cardano_failed_inspect
      changed_when: false
      failed_when: false

    - name: Capture failed cardano container logs
      ansible.builtin.shell: "docker logs --tail 200 cardano-node"
      register: cardano_failed_logs
      changed_when: false
      failed_when: false

    - name: Remove failed new cardano-node container
      community.docker.docker_container:
        name: cardano-node
        state: absent
      failed_when: false

    - name: Restore legacy container name after failed takeover
      ansible.builtin.shell: "docker rename {{ takeover_legacy_container_name }} cardano-node"
      when: takeover_switch_enabled
      failed_when: false

    - name: Restart restored legacy container
      community.docker.docker_container:
        name: cardano-node
        state: started
      when: takeover_switch_enabled
      failed_when: false

    - name: Fail deployment after takeover rollback
      fail:
        msg: >-
          cardano-node start or health-check failed; legacy container was restored when possible
          (takeover={{ takeover_switch_enabled }}).
          inspect={{ cardano_failed_inspect.stdout | default('n/a') }}
          logs={{ cardano_failed_logs.stderr | default(cardano_failed_logs.stdout | default('n/a')) }}
