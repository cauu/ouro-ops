- name: Check whether cardano-node container exists for runtime restart
  shell: docker inspect --format '{{"{{"}}.State.Status{{"}}"}}' cardano-node
  register: cardano_runtime_restart_existing_status
  changed_when: false
  failed_when: false

- name: Fail when runtime restart targets a missing container
  fail:
    msg: "cardano-node container is missing; use deploy for initial provisioning"
  when: cardano_runtime_restart_existing_status.rc != 0

- name: Restart cardano-node runtime
  shell: docker restart cardano-node
  register: cardano_runtime_restart_result
  changed_when: true

- name: Wait for cardano container to stay running after runtime restart
  shell: docker inspect --format '{{"{{"}}if and .State.Running (not .State.Restarting){{"}}"}}ok{{"{{"}}end{{"}}"}}' cardano-node
  register: cardano_runtime_restart_running_check
  until: cardano_runtime_restart_running_check.rc == 0 and (cardano_runtime_restart_running_check.stdout | trim) == 'ok'
  retries: 24
  delay: 5
  changed_when: false

- name: Wait for cardano socket file inside container after runtime restart
  shell: docker exec cardano-node sh -lc 'test -S /ipc/node.socket'
  register: cardano_runtime_restart_socket_check
  until: cardano_runtime_restart_socket_check.rc == 0
  retries: 24
  delay: 5
  changed_when: false

- name: Wait for cardano tip query to succeed after runtime restart
  shell: |
    docker exec cardano-node cardano-cli query tip \
      --socket-path /ipc/node.socket \
      --{{ network }}
  register: cardano_runtime_restart_tip_raw
  until: cardano_runtime_restart_tip_raw.rc == 0
  retries: 24
  delay: 5
  changed_when: false

- name: Report runtime restart result
  debug:
    msg:
      role: "{{ role }}"
      restart_performed: true
      note: "Runtime container restarted without deploy flow"
  changed_when: false
