---
# Container volume mapping: /opt/cardano/keys (host) -> /opt/cardano/config/keys (container)
# docker exec commands use container-internal paths; fetch/stat use host paths.

- name: Validate KES generate target inputs
  ansible.builtin.assert:
    that:
      - role == "bp"
      - kes_vkey_fetch_dest is defined
    fail_msg: "kes generate requires bp role and kes_vkey_fetch_dest"

- name: Inspect existing cardano-node container before KES generate
  community.docker.docker_container_info:
    name: cardano-node
  register: kes_gen_container_info
  failed_when: false

- name: Fail when cardano-node runtime does not exist
  ansible.builtin.fail:
    msg: "cardano-node runtime not found; use deploy for initial provisioning"
  when: not (kes_gen_container_info.exists | default(false))

- name: Check cardano-cli is available in container
  ansible.builtin.command: docker exec cardano-node cardano-cli --version
  register: kes_gen_cli_check
  changed_when: false
  failed_when: false

- name: Fail when cardano-cli is not available
  ansible.builtin.fail:
    msg: "cardano-cli not found in cardano-node container"
  when: kes_gen_cli_check.rc != 0

- name: Generate KES keypair on block producer
  ansible.builtin.command: >-
    docker exec cardano-node
    cardano-cli latest node key-gen-KES
    --verification-key-file /opt/cardano/config/keys/kes.vkey
    --signing-key-file /opt/cardano/config/keys/kes.skey
  register: kes_gen_result
  changed_when: kes_gen_result.rc == 0

- name: Set correct ownership on generated KES keys (host path)
  ansible.builtin.file:
    path: "/opt/cardano/keys/{{ item }}"
    owner: "1000"
    group: "1000"
  loop:
    - kes.vkey
    - kes.skey

- name: Set correct permissions on KES signing key (host path)
  ansible.builtin.file:
    path: /opt/cardano/keys/kes.skey
    mode: "0400"

- name: Capture cardano-node version for release matching
  ansible.builtin.command: docker exec cardano-node cardano-node --version
  register: kes_gen_node_version
  changed_when: false
  failed_when: false

- name: Write version metadata to host temp file
  ansible.builtin.copy:
    content: |
      {{ kes_gen_cli_check.stdout | default('') | trim }}
      {{ kes_gen_node_version.stdout_lines[0] | default('') | trim }}
    dest: /tmp/ouro-kes-version.txt
    mode: "0644"

- name: Fetch kes.vkey from block producer to control plane
  ansible.builtin.fetch:
    src: /opt/cardano/keys/kes.vkey
    dest: "{{ kes_vkey_fetch_dest }}"
    flat: true

- name: Fetch version metadata to control plane
  ansible.builtin.fetch:
    src: /tmp/ouro-kes-version.txt
    dest: "{{ kes_vkey_fetch_dest | dirname }}/cardano-version.txt"
    flat: true

- name: Report KES generate result
  ansible.builtin.debug:
    msg:
      status: success
      kes_vkey_fetched: "{{ kes_vkey_fetch_dest }}"
      cardano_cli_version: "{{ kes_gen_cli_check.stdout | default('') | trim }}"
      cardano_node_version: "{{ kes_gen_node_version.stdout_lines[0] | default('') | trim }}"
