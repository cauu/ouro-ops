---
- name: Ensure Cardano backup directory exists
  file:
    path: /opt/cardano/backup
    state: directory
    owner: root
    group: root
    mode: "0755"
  when: upgrade_phase == 'BACKUP_CONFIG'

- name: Compute backup archive path for upgrade
  set_fact:
    cardano_upgrade_backup_archive: >-
      {{
        backup_archive
        | default('/opt/cardano/backup/config-' ~ ansible_date_time.iso8601_basic ~ '.tar.gz', true)
      }}
  when: upgrade_phase == 'BACKUP_CONFIG'

- name: Back up /opt/cardano/config before upgrade
  shell: |
    set -euo pipefail
    tar -C /opt/cardano -czf "{{ cardano_upgrade_backup_archive }}" config
  args:
    executable: /bin/bash
  register: cardano_upgrade_backup_result
  changed_when: true
  when: upgrade_phase == 'BACKUP_CONFIG'

- name: Report upgrade backup archive
  debug:
    msg:
      backup_archive: "{{ cardano_upgrade_backup_archive }}"
      phase: "{{ upgrade_phase }}"
  changed_when: false
  when: upgrade_phase == 'BACKUP_CONFIG'

- name: Resolve target image reference for upgrade
  set_fact:
    cardano_upgrade_image_ref: >-
      {{
        (image_registry | default('ghcr.io/blinklabs-io/cardano-node', true) | trim)
        ~
        (
          '@' ~ (image_digest | default('', true) | trim)
          if ((image_digest | default('', true) | trim | length) > 0)
          else ':' ~ (target_version | default('10.5.4-1', true) | trim)
        )
      }}
  when: upgrade_phase in ['UPGRADING_RELAY_N', 'HEALTH_GATE_RELAY', 'UPGRADING_BP', 'HEALTH_GATE_BP']

- name: Check whether cardano-node container exists for upgrade
  shell: docker inspect --format '{{"{{"}}.State.Status{{"}}"}}' cardano-node
  register: cardano_upgrade_existing_status
  changed_when: false
  failed_when: false
  when: upgrade_phase in ['UPGRADING_RELAY_N', 'HEALTH_GATE_RELAY', 'UPGRADING_BP', 'HEALTH_GATE_BP']

- name: Fail when upgrade targets a missing container
  fail:
    msg: "cardano-node container is missing; use deploy for initial provisioning"
  when:
    - upgrade_phase in ['UPGRADING_RELAY_N', 'HEALTH_GATE_RELAY', 'UPGRADING_BP', 'HEALTH_GATE_BP']
    - cardano_upgrade_existing_status.rc != 0

- name: Build cardano environment for upgrade
  set_fact:
    cardano_upgrade_env:
      CARDANO_BLOCK_PRODUCER: "{{ 'true' if role == 'bp' else 'false' }}"
      CARDANO_CONFIG_BASE: /opt/cardano/config
      CARDANO_NETWORK: "{{ network }}"
      CARDANO_CONFIG: "/opt/cardano/config/{{ network }}/config.json"
      CARDANO_TOPOLOGY: "/opt/cardano/config/{{ network }}/topology.json"
      CARDANO_DATABASE_PATH: /data/db
      CARDANO_SOCKET_PATH: /ipc/node.socket
      CARDANO_PORT: "3001"
      RESTORE_SNAPSHOT: "false"
  when: upgrade_phase in ['UPGRADING_RELAY_N', 'HEALTH_GATE_RELAY', 'UPGRADING_BP', 'HEALTH_GATE_BP']

- name: Add BP forge credentials to upgrade env
  set_fact:
    cardano_upgrade_env: >-
      {{
        cardano_upgrade_env
        | combine({
          'CARDANO_SHELLEY_KES_KEY': '/opt/cardano/config/keys/kes.skey',
          'CARDANO_SHELLEY_OPERATIONAL_CERTIFICATE': '/opt/cardano/config/keys/node.cert',
          'CARDANO_SHELLEY_VRF_KEY': '/opt/cardano/config/keys/vrf.skey'
        })
      }}
  when:
    - role == 'bp'
    - upgrade_phase in ['UPGRADING_RELAY_N', 'HEALTH_GATE_RELAY', 'UPGRADING_BP', 'HEALTH_GATE_BP']

- name: Pull target cardano image for upgrade
  community.docker.docker_image:
    name: "{{ cardano_upgrade_image_ref }}"
    source: pull
  when: upgrade_phase in ['UPGRADING_RELAY_N', 'HEALTH_GATE_RELAY', 'UPGRADING_BP', 'HEALTH_GATE_BP']

- name: Restart cardano-node on target image
  community.docker.docker_container:
    name: cardano-node
    image: "{{ cardano_upgrade_image_ref }}"
    state: started
    recreate: true
    restart_policy: unless-stopped
    command: run
    env: "{{ cardano_upgrade_env }}"
    ports:
      - "3001:3001"
    volumes:
      - /opt/cardano/config:/opt/cardano/config
      - /opt/cardano/db:/data/db
      - /opt/cardano/ipc:/ipc
      - /opt/cardano/keys:/opt/cardano/config/keys
  when: upgrade_phase in ['UPGRADING_RELAY_N', 'HEALTH_GATE_RELAY', 'UPGRADING_BP', 'HEALTH_GATE_BP']

- name: Wait for upgraded container to stay running
  shell: docker inspect --format '{{"{{"}}if and .State.Running (not .State.Restarting){{"}}"}}ok{{"{{"}}end{{"}}"}}' cardano-node
  register: cardano_upgrade_running_check
  until: cardano_upgrade_running_check.rc == 0 and (cardano_upgrade_running_check.stdout | trim) == 'ok'
  retries: 24
  delay: 5
  changed_when: false
  when: upgrade_phase in ['UPGRADING_RELAY_N', 'HEALTH_GATE_RELAY', 'UPGRADING_BP', 'HEALTH_GATE_BP']

- name: Wait for upgraded socket to appear
  shell: docker exec cardano-node sh -lc 'test -S /ipc/node.socket'
  register: cardano_upgrade_socket_check
  until: cardano_upgrade_socket_check.rc == 0
  retries: 24
  delay: 5
  changed_when: false
  when: upgrade_phase in ['UPGRADING_RELAY_N', 'HEALTH_GATE_RELAY', 'UPGRADING_BP', 'HEALTH_GATE_BP']

- name: Wait for upgraded tip query to succeed
  shell: |
    docker exec cardano-node cardano-cli query tip \
      --socket-path /ipc/node.socket \
      --{{ network }}
  register: cardano_upgrade_tip_raw
  until: cardano_upgrade_tip_raw.rc == 0
  retries: 24
  delay: 5
  changed_when: false
  when: upgrade_phase in ['UPGRADING_RELAY_N', 'HEALTH_GATE_RELAY', 'UPGRADING_BP', 'HEALTH_GATE_BP']

- name: Report upgrade runtime result
  debug:
    msg:
      phase: "{{ upgrade_phase }}"
      image: "{{ cardano_upgrade_image_ref }}"
      health_check: passed
  changed_when: false
  when: upgrade_phase in ['UPGRADING_RELAY_N', 'HEALTH_GATE_RELAY', 'UPGRADING_BP', 'HEALTH_GATE_BP']
