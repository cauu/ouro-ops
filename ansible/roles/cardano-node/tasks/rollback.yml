---
- name: Require backup archive for rollback
  assert:
    that:
      - backup_archive is defined
      - (backup_archive | trim | length) > 0
      - previous_version is defined or (previous_image_digest | default('', true) | trim | length) > 0
    fail_msg: "rollback requires backup_archive and previous_version or previous_image_digest"

- name: Resolve rollback image reference
  set_fact:
    cardano_rollback_image_ref: >-
      {{
        (previous_image_registry | default('ghcr.io/blinklabs-io/cardano-node', true) | trim)
        ~
        (
          '@' ~ (previous_image_digest | default('', true) | trim)
          if ((previous_image_digest | default('', true) | trim | length) > 0)
          else ':' ~ (previous_version | default('10.5.4-1', true) | trim)
        )
      }}

- name: Check whether rollback archive exists
  stat:
    path: "{{ backup_archive }}"
  register: cardano_rollback_archive

- name: Fail when rollback archive is missing
  fail:
    msg: "rollback archive not found: {{ backup_archive }}"
  when: not (cardano_rollback_archive.stat.exists | default(false))

- name: Check whether cardano-node container exists for rollback
  shell: docker inspect --format '{{"{{"}}.State.Status{{"}}"}}' cardano-node
  register: cardano_rollback_existing_status
  changed_when: false
  failed_when: false

- name: Fail when rollback targets a missing container
  fail:
    msg: "cardano-node container is missing; use deploy for initial provisioning"
  when: cardano_rollback_existing_status.rc != 0

- name: Stop current cardano-node container before rollback
  community.docker.docker_container:
    name: cardano-node
    state: stopped

- name: Clear current config directory before rollback restore
  shell: |
    set -euo pipefail
    find /opt/cardano/config -mindepth 1 -maxdepth 1 -exec rm -rf {} +
  args:
    executable: /bin/bash

- name: Restore backed up config archive
  shell: |
    set -euo pipefail
    tar -xzf "{{ backup_archive }}" -C /opt/cardano
  args:
    executable: /bin/bash

- name: Build rollback cardano environment
  set_fact:
    cardano_rollback_env:
      CARDANO_BLOCK_PRODUCER: "{{ 'true' if role == 'bp' else 'false' }}"
      CARDANO_CONFIG_BASE: /opt/cardano/config
      CARDANO_NETWORK: "{{ network }}"
      CARDANO_CONFIG: "/opt/cardano/config/{{ network }}/config.json"
      CARDANO_TOPOLOGY: "/opt/cardano/config/{{ network }}/topology.json"
      CARDANO_DATABASE_PATH: /data/db
      CARDANO_SOCKET_PATH: /ipc/node.socket
      CARDANO_PORT: "3001"
      RESTORE_SNAPSHOT: "false"

- name: Add BP forge credentials to rollback env
  set_fact:
    cardano_rollback_env: >-
      {{
        cardano_rollback_env
        | combine({
          'CARDANO_SHELLEY_KES_KEY': '/opt/cardano/config/keys/kes.skey',
          'CARDANO_SHELLEY_OPERATIONAL_CERTIFICATE': '/opt/cardano/config/keys/node.cert',
          'CARDANO_SHELLEY_VRF_KEY': '/opt/cardano/config/keys/vrf.skey'
        })
      }}
  when: role == 'bp'

- name: Pull rollback cardano image
  community.docker.docker_image:
    name: "{{ cardano_rollback_image_ref }}"
    source: pull

- name: Start rollback cardano-node container
  community.docker.docker_container:
    name: cardano-node
    image: "{{ cardano_rollback_image_ref }}"
    state: started
    recreate: true
    restart_policy: unless-stopped
    command: run
    env: "{{ cardano_rollback_env }}"
    ports:
      - "3001:3001"
      - "12798:12798"
    volumes:
      - /opt/cardano/config:/opt/cardano/config
      - /opt/cardano/db:/data/db
      - /opt/cardano/ipc:/ipc
      - /opt/cardano/keys:/opt/cardano/config/keys

- name: Wait for rollback container to stay running
  shell: docker inspect --format '{{"{{"}}if and .State.Running (not .State.Restarting){{"}}"}}ok{{"{{"}}end{{"}}"}}' cardano-node
  register: cardano_rollback_running_check
  until: cardano_rollback_running_check.rc == 0 and (cardano_rollback_running_check.stdout | trim) == 'ok'
  retries: 24
  delay: 5
  changed_when: false

- name: Wait for rollback socket to appear
  shell: docker exec cardano-node sh -lc 'test -S /ipc/node.socket'
  register: cardano_rollback_socket_check
  until: cardano_rollback_socket_check.rc == 0
  retries: 24
  delay: 5
  changed_when: false

- name: Wait for rollback tip query to succeed
  shell: |
    docker exec cardano-node cardano-cli query tip \
      --socket-path /ipc/node.socket \
      --{{ network }}
  register: cardano_rollback_tip_raw
  until: cardano_rollback_tip_raw.rc == 0
  retries: 24
  delay: 5
  changed_when: false

- name: Report rollback result
  debug:
    msg:
      image: "{{ cardano_rollback_image_ref }}"
      backup_archive: "{{ backup_archive }}"
      health_check: passed
  changed_when: false
