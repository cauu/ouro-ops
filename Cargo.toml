[package]
name = "ouro"
version = "0.1.0"
edition = "2021"
description = "Deterministic Cardano stake pool operations CLI"

[lib]
path = "crates/ouro/src/lib.rs"

[[bin]]
name = "ouro-ops"
path = "crates/ouro/src/main.rs"

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
ed25519-dalek = "2.2"
flate2 = "1"
hmac = "0.12"
libc = "0.2"
rusqlite = { version = "0.32", features = ["bundled"] }
sha2 = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_cbor = "0.11"
serde_yaml = "0.9"
thiserror = "2"
tar = "0.4"
uuid = { version = "1", features = ["v4", "serde"] }
