[package]
name = "ouro"
version = "0.1.0"
edition = "2021"
description = "Deterministic Cardano stake pool operations CLI"

[lib]
path = "crates/ouro/src/lib.rs"

[[bin]]
name = "ouro"
path = "crates/ouro/src/main.rs"

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
thiserror = "2"
uuid = { version = "1", features = ["v4", "serde"] }
