# S0015 containerized E2E bed (p1-1 skeleton).
# Topology (see docs/design/S0015-execution-topology.md): control drives ouro and
# SSHes to bp1 / relay1 / relay2. Node model, credentials, sudoers, and cardano-node
# are layered in by p1-2..p1-5 and p2-1. `name:` fixes the compose project so each run
# is isolated and `docker compose down -v` reliably reaps everything (E2E-15).
name: ouro-e2e

services:
  control:
    build:
      context: .
      dockerfile: control/Dockerfile
    hostname: control
    networks: [bed]

  bp1:
    build:
      context: .
      dockerfile: node/Dockerfile
    hostname: bp1
    networks: [bed]

  relay1:
    build:
      context: .
      dockerfile: node/Dockerfile
    hostname: relay1
    networks: [bed]

  relay2:
    build:
      context: .
      dockerfile: node/Dockerfile
    hostname: relay2
    networks: [bed]

networks:
  bed:
    driver: bridge
