# S0015 containerized E2E bed (p1-1 skeleton).
# Topology (see docs/design/S0015-execution-topology.md): control drives ouro and
# SSHes to bp1 / relay1 / relay2. Node model, credentials, sudoers, and cardano-node
# are layered in by p1-2..p1-5 and p2-1.
# Project name defaults to `ouro-e2e` for predictable single-run teardown; set
# OURO_E2E_PROJECT to a unique value for parallel/CI isolation. Per-run unique-project
# isolation is finalized in p1-7 (a single fixed name is NOT per-run isolation).
name: ${OURO_E2E_PROJECT:-ouro-e2e}

services:
  control:
    build:
      context: .
      dockerfile: control/Dockerfile
    hostname: control
    init: true
    networks: [bed]

  # bp1 runs a REAL forging cardano-node (p2-1) — hence a distinct image (blinklabs node
  # base + the same pinned ouro). `up --wait` blocks on its healthcheck until it forges.
  bp1:
    build:
      context: .
      dockerfile: bp/Dockerfile
    hostname: bp1
    networks: [bed]

  relay1:
    build:
      context: .
      dockerfile: node/Dockerfile
    hostname: relay1
    networks: [bed]

  relay2:
    build:
      context: .
      dockerfile: node/Dockerfile
    hostname: relay2
    networks: [bed]

networks:
  bed:
    driver: bridge
