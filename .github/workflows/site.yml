name: Site release-form validation

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "ouro-skills/**"
      - "web/onboarding/**"
      - "tests/test_web_generator.py"
      - "tests/test_skill_docs.py"
      - ".github/workflows/site.yml"
  push:
    branches:
      - next
    paths:
      - "ouro-skills/**"
      - "web/onboarding/**"
      - "tests/test_web_generator.py"
      - "tests/test_skill_docs.py"
      - ".github/workflows/site.yml"

permissions:
  contents: read

jobs:
  local-production-form:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: python3 -m pip install -r requirements-dev.txt
      - name: Build site from exactly six canonical Skills
        run: ./web/onboarding/build.sh
      - name: Verify generator, copied content and local HTTP form
        run: |
          python3 -m pytest -q tests/test_web_generator.py
          python3 tests/test_skill_docs.py

# Production Cloudflare deployment and production-domain acceptance are deliberately deferred to
# the next specification. This workflow uploads no hosted site artifact and uses no deploy secret.
