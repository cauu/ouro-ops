name: l2-integration

on:
  pull_request:
  push:

jobs:
  l2:
    strategy:
      fail-fast: false
      matrix:
        image:
          - ubuntu:24.04
          - debian:12
          - rockylinux:9
    runs-on: ubuntu-latest
    container:
      image: ${{ matrix.image }}
    steps:
      - uses: actions/checkout@v4
      - name: Install runtime dependencies
        run: |
          if command -v apt-get >/dev/null 2>&1; then
            apt-get update
            apt-get install -y bash curl gcc libsqlite3-dev nodejs pkg-config python3 python3-pip python3-venv
          elif command -v dnf >/dev/null 2>&1; then
            dnf install -y bash gcc nodejs sqlite-devel pkgconf-pkg-config python3 python3-pip
          fi
          python3 -m venv /opt/ouro-ci-venv
          /opt/ouro-ci-venv/bin/python -m pip install -r requirements-dev.txt
          curl https://sh.rustup.rs -sSf | sh -s -- -y --profile minimal
      - name: Run L2 integration suite
        run: |
          . "$HOME/.cargo/env"
          export PATH="/opt/ouro-ci-venv/bin:$PATH"
          bash ci/l2-integration.sh
