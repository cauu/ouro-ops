# S0015 p3-4 — tiered E2E CI gates. The test pyramid (spec §2.2) maps to three gates with
# distinct cadence + budget, so the deterministic CLI layer is never regressed by the slow/real
# layers, and vice versa:
#   T1  make test + ci   — every PR/push  (cargo unit + L2 skill integration; fast)
#   T2  make e2e-t2       — every push     (deterministic container E2E, real node; <=25 min)
#   T3  make e2e-t3       — nightly + manual gate (agent-harness 5-invariant asserter; <=45 min)
# The container tiers run on ubuntu-latest (amd64); the bed's cardano-node image is multi-arch
# (blinklabs), so it runs NATIVELY on the amd64 runner — no emulation. Product failures are hard
# FAILs and must NOT be retried as flake (only classified infra faults may retry).
name: e2e-tiers

on:
  pull_request:
  push:
  schedule:
    - cron: "0 3 * * *"        # nightly T3 gate
  workflow_dispatch:

jobs:
  t1:
    name: T1 (cargo + L2) — every PR
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: |
          apt-get update && apt-get install -y gcc libsqlite3-dev pkg-config python3 python3-pip || true
          python3 -m pip install jsonschema pyyaml || pip3 install jsonschema pyyaml || true
          curl https://sh.rustup.rs -sSf | sh -s -- -y --profile minimal
      - run: . "$HOME/.cargo/env" && make test && make ci

  t2:
    name: T2 (container E2E, real node) — every push
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - run: make e2e-t2

  t3:
    name: T3 (agent-harness invariants) — nightly gate
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - run: make e2e-t3       # N>=3 runs, 0 invariant violations or hard FAIL
