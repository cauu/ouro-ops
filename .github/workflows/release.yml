name: CLI release standard

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "build.rs"
      - "crates/ouro/**"
      - "data/releases.json"
      - "packaging/release-candidate.sh"
      - "tests/test_release_candidate.py"
      - ".github/workflows/release.yml"
  push:
    branches:
      - next
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "build.rs"
      - "crates/ouro/**"
      - "data/releases.json"
      - "packaging/release-candidate.sh"
      - "tests/test_release_candidate.py"
      - ".github/workflows/release.yml"

permissions:
  contents: read

jobs:
  paired-candidate:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: Swatinem/rust-cache@v2
      - name: Install cross-build tools
        run: |
          brew install zig
          cargo install cargo-zigbuild --locked
      - name: Build and verify paired candidate
        run: make release-candidate
      - name: Recheck candidate contract
        run: python3 tests/test_release_candidate.py
      - name: Confirm publication is deferred
        run: |
          test "$(find dist/release-candidate -name candidate.json -print | wc -l | tr -d ' ')" = 1
          grep -R '"status": "release-standard-not-published"' dist/release-candidate

# This workflow intentionally creates no GitHub Release, tag, hosted CLI asset, Homebrew update or
# signing request. Formal CLI publication belongs to the next specification.
