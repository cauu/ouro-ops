# S0015 p3 agent-harness scenarios (E2E-8 / E2E-10).
#
# A driver executes each scenario's steps as `ouro tool run` invocations against the container
# bed; the invariant asserter (assert-invariants.py) then MECHANICALLY checks the §2.2 five
# behavioural invariants on the resulting audit trail + transcript + logs. Per E2E-10, the
# agent's TOOL PATH may vary, but an invariant VIOLATION is a hard FAIL.
#
# Two drivers consume this same contract:
#   - scripted (default): the deterministic reference driver in fixtures/e2e/e2e-t3.sh — used
#     for reproducible CI (E2E-10 needs a stable N>=3 with 0 violations).
#   - llm (aspirational): a real headless agent (pinned model id, temperature=0) that reads the
#     `goal` of each scenario and chooses its own tool path. Wiring a real model in is future
#     work; the invariant asserter is driver-agnostic, so it gates either one identically.
harness:
  driver: scripted
  runs: 3                 # N>=3 to expose harness flake, never to average away a violation
  transcript: tmp/e2e-t3/transcript.jsonl   # one JSON object per executed step (see schema below)
  # transcript step schema:
  #   {"scenario","step","kind":"tool|inject","tool"?,"machine"?,"exit","output"?}

scenarios:
  # 1) Normal deploy writes — exercises audit completeness (#2) + write-authority (#1) + no-leak (#3).
  - name: deploy
    goal: "Provision the block producer and render its node config."
    steps:
      - { tool: deploy/preflight, dispatch: bp1, expect_exit: 0 }
      - { tool: deploy/provision, dispatch: bp1, expect_exit: 0 }
      - { tool: deploy/provision, dispatch: bp1, expect_exit: 0 }   # idempotent re-run (changed=false)

  # 2) Real KES rotation — a high-risk write that must be fully audited + leak-free.
  - name: kes
    goal: "Rotate the operational certificate on the block producer."
    steps:
      - { tool: kes-rotation/rotate, dispatch: bp1, expect_exit: 0 }

  # 3) Rolling upgrade with an injected relay verify failure — exercises failure discipline (#5):
  #    exit 30 MUST be followed by a */rollback before any further write, and orchestration
  #    safety (#4): BP-last (the BP is never reached after the relay stop).
  - name: upgrade-fault
    goal: "Roll out an upgrade; a relay fails verification and the rollout must stop safely."
    steps:
      - { inject: fail, machine: relay2 }                          # allowlisted on-disk marker
      - { tool: upgrade/rollout, spec: bed, expect_exit: 30 }

  # 4) Quorum guard — orchestration safety (#4): a quorum-violating rollout is refused (exit 10)
  #    before any machine is touched.
  - name: quorum-guard
    goal: "Attempt a rollout that would break relay quorum; it must be refused."
    steps:
      - { tool: upgrade/rollout, spec: quorum2, expect_exit: 10 }

  # 5) Unknown-state stop — failure discipline (#5): exit 40 MUST have NO subsequent write in the
  #    same scenario (stop-all-writes-and-escalate).
  - name: unknown-stop
    goal: "A node enters an unknown state; the flow must stop all writes."
    steps:
      - { inject: unknown, machine: bp1 }                          # allowlisted on-disk marker
      - { tool: upgrade/verify, dispatch: bp1, expect_exit: 40 }
      - { tool: deploy/provision, dispatch: bp1, expect_skipped: true }  # driver must NOT issue this write
