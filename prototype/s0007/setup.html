<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Ouro Ops Prototype - Setup</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="shell viewport-shell">
      <header class="topbar compact-topbar">
        <div class="brand compact-brand">
          <span class="brand-mark"></span>
          <div><h1>Setup</h1></div>
        </div>
        <div class="actions">
          <a href="./index.html" class="chip">🏠 Dashboard</a>
          <a href="./setup.html" class="chip" aria-current="page">🛠 Setup</a>
        </div>
      </header>

      <main class="dashboard-shell">
        <aside class="side-panel">
          <p class="label">State</p>
          <div class="stack">
            <div class="item"><span>🧩 Pool</span><strong class="danger">None</strong></div>
            <div class="item"><span>👤 Login</span><strong>N/A</strong></div>
            <div class="item"><span>➡️ Next</span><strong>Create</strong></div>
          </div>
        </aside>

        <section class="main-panel">
          <article class="module-card big-card">
            <header><span class="big-icon">➕</span><h3>Create Pool</h3></header>
            <p class="hint">No pool found. Tap create to start onboarding.</p>
            <div class="actions">
              <a href="./setup-onboarding.html" class="btn primary">Create</a>
              <a href="./index.html" class="btn">Already created</a>
            </div>
          </article>
        </section>
      </main>
    </div>
  </body>
</html>
