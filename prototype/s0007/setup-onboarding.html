<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Ouro Ops Prototype - Onboarding</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="shell viewport-shell">
      <header class="topbar compact-topbar">
        <div class="brand compact-brand">
          <span class="brand-mark"></span>
          <div><h1>Onboarding</h1></div>
        </div>
        <span class="chip">🛠 Step 1/1</span>
      </header>

      <main class="dashboard-shell">
        <aside class="side-panel">
          <p class="label">Flow</p>
          <div class="stack">
            <div class="item"><span>🏷️ Ticker</span><strong>Required</strong></div>
            <div class="item"><span>🌐 Network</span><strong>Required</strong></div>
            <div class="item"><span>⚙️ Defaults</span><strong>Optional</strong></div>
          </div>
        </aside>

        <section class="main-panel">
          <article class="module-card big-card">
            <header><span class="big-icon">🧩</span><h3>Pool Parameters</h3></header>
            <form class="form compact-form">
              <div class="field">
                <label for="pool-ticker">🏷️ Ticker</label>
                <input id="pool-ticker" class="input" placeholder="BUBB" />
              </div>
              <div class="field">
                <label for="pool-network">🌐 Network</label>
                <select id="pool-network" class="select">
                  <option>mainnet</option>
                  <option>preprod</option>
                  <option>preview</option>
                </select>
              </div>
              <div class="field">
                <label for="pool-margin">📊 Margin</label>
                <input id="pool-margin" class="input" placeholder="0.03" />
              </div>
              <div class="field">
                <label for="pool-fixed-cost">💰 Fixed cost</label>
                <input id="pool-fixed-cost" class="input" placeholder="170000000" />
              </div>
              <div class="actions">
                <a href="./index.html" class="btn primary">Create</a>
                <a href="./setup.html" class="btn">Back</a>
              </div>
            </form>
          </article>
        </section>
      </main>
    </div>
  </body>
</html>
