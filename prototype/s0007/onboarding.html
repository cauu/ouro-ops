<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Ouro Ops Prototype - Welcome</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <a class="skip-link" href="#main-content">跳到主内容</a>
    <div class="window-shell welcome-shell">
      <div class="window welcome-window">
        <header class="titlebar">
          <div class="titlebar-leading">
            <div class="traffic-lights" aria-hidden="true">
              <span class="light red"></span>
              <span class="light yellow"></span>
              <span class="light green"></span>
            </div>
          </div>
          <h1 class="window-title">Welcome · Ouro Ops</h1>
          <div class="toolbar">
            <button class="toolbar-chip warn" type="button">Not Deployed</button>
          </div>
        </header>

        <div class="workspace focused-workspace">
          <main id="main-content" class="content welcome-content">
            <section class="welcome-panel" aria-label="welcome window">
              <div class="hero-mark" aria-hidden="true"></div>
              <h2 class="welcome-title">欢迎使用 Ouro Ops</h2>
              <p class="welcome-subtitle">未检测到部署环境。点击“开始部署”进入沉浸式向导。</p>

              <div class="welcome-actions">
                <a class="btn primary" href="./deploy.html">开始部署</a>
                <button class="btn" type="button">导入已有配置</button>
              </div>

              <p class="transition-note">
                已经部署完成？
                <a class="text-link" href="./index.html">直接进入 Dashboard</a>
              </p>
            </section>
          </main>
        </div>
      </div>
    </div>
  </body>
</html>
