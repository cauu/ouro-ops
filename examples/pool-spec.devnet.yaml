# S0015 p2 devnet pool-spec. The private devnet reuses preprod's magic (1) so the spec is
# schema-valid (spec.network is a fixed enum; see docs/design/S0015-p2-0-devnet-spike.md).
# Generate the devnet with DEVNET_MAGIC=1 to match. sync.mode: genesis (Mithril is OUT on devnet).
spec_version: 1
pool:
  ticker: OURO
  network: preprod
  network_magic: 1
  genesis_hashes:
    shelley: "162d29c4e1cf6b8a84f2d692e67a3ac6bc7851bc3e6e4afe64d15778bed8bd86"
  metadata_url: "https://pool.example.com/metadata.json"
  pledge_lovelace: 100000000000
  margin: 0.02
  cost_lovelace: 340000000
topology_mode: p2p
node_version: "10.5.4"
machines:
  - id: bp1
    role: bp
    ssh: { host: bp1, port: 22, user: ouro-exec, key_ref: "creds://bp1" }
  - id: relay1
    role: relay
    public_endpoint: { host: relay1, port: 3001 }
    ssh: { host: relay1, port: 22, user: ouro-exec, key_ref: "creds://relay1" }
sync:
  mode: genesis
